[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true
ast = true
build_info = true
# OpenZeppelin validation needs one current build-info set after source edits.
force = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 100
